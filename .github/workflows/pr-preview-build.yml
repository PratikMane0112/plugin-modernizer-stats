name: Build PR Preview

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
  pull_request:
    types:
      - closed
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to build and deploy preview for'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: >-
    preview-build-${{
      github.event_name == 'workflow_dispatch' && inputs.pr-number ||
      github.event_name == 'pull_request' && github.event.number ||
      format('{0}-{1}',
        github.event.workflow_run.head_repository.full_name,
        github.event.workflow_run.head_branch)
    }}
  cancel-in-progress: true

jobs:
  build-preview:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR number from workflow run
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        id: pr-info-wr
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (prs && prs.length > 0) {
              core.setOutput('pr-number', prs[0].number.toString());
              console.log(`Found PR #${prs[0].number} from workflow_run.pull_requests`);
              return;
            }

            // For fork PRs, pull_requests is always empty.
            // Use head_sha to find the associated PR (works for both forks and same-repo).
            const headSha = context.payload.workflow_run.head_sha;
            console.log(`pull_requests is empty, searching by head_sha: ${headSha}`);
            const { data: commitPrs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha
            });
            const openPr = commitPrs.find(pr => pr.state === 'open');
            if (openPr) {
              core.setOutput('pr-number', openPr.number.toString());
              console.log(`Found PR #${openPr.number} from commit SHA lookup`);
              return;
            }

            // Final fallback: search by head owner and branch.
            // API expects "owner:branch", not "owner/repo:branch".
            const headOwner = context.payload.workflow_run.head_repository.owner.login;
            const headBranch = context.payload.workflow_run.head_branch;
            console.log(`Commit lookup found no open PR, searching by head: ${headOwner}:${headBranch}`);
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${headOwner}:${headBranch}`,
              state: 'open'
            });
            if (pulls.length > 0) {
              core.setOutput('pr-number', pulls[0].number.toString());
              console.log(`Found PR #${pulls[0].number} from branch lookup`);
            } else {
              core.setFailed('No open PR found for this workflow run');
            }

      - name: Set PR metadata
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr-number=${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "pr-action=closed" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr-number=${{ inputs.pr-number }}" >> "$GITHUB_OUTPUT"
            echo "pr-action=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "pr-number=${{ steps.pr-info-wr.outputs.pr-number }}" >> "$GITHUB_OUTPUT"
            echo "pr-action=deploy" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR code
        if: steps.pr-info.outputs.pr-action != 'closed'
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ steps.pr-info.outputs.pr-number }}/head

      - name: Setup Node.js
        if: steps.pr-info.outputs.pr-action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.pr-info.outputs.pr-action != 'closed'
        run: npm ci

      - name: Fetch metadata
        if: steps.pr-info.outputs.pr-action != 'closed'
        run: npm run fetch-metadata

      - name: Build for preview
        if: steps.pr-info.outputs.pr-action != 'closed'
        run: |
          npx tsc -b
          npx vite build --base /${{ github.event.repository.name }}/pr-preview/pr-${{ steps.pr-info.outputs.pr-number }}/
          cp dist/index.html dist/404.html

      - name: Upload build artifact
        if: steps.pr-info.outputs.pr-action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-build
          path: dist/
          if-no-files-found: error

      - name: Save PR metadata
        run: |
          mkdir -p pr-metadata
          echo "${{ steps.pr-info.outputs.pr-number }}" > pr-metadata/pr-number
          echo "${{ steps.pr-info.outputs.pr-action }}" > pr-metadata/pr-action
          if [ "${{ steps.pr-info.outputs.pr-action }}" != "closed" ]; then
            git rev-parse HEAD > pr-metadata/pr-head-sha
            git log -1 --format='%s' > pr-metadata/pr-commit-message
          fi

      - name: Upload PR metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr-metadata
          path: pr-metadata/
          if-no-files-found: error
